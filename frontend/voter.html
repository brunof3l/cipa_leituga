<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina do Eleitor | CIPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#eff6ff",
                100: "#dbeafe",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="safe-bottom hidden-until-ready text-slate-800">
    <header class="border-b border-slate-200/70 bg-white/70 backdrop-blur-md">
      <div class="mx-auto flex w-full max-w-7xl flex-col gap-3 px-4 py-4 sm:px-6 md:flex-row md:items-center md:justify-between">
        <div>
          <p class="text-sm font-semibold text-brand-700">Votacao CIPA</p>
          <h1 class="text-lg font-bold text-slate-900 sm:text-xl">Pagina do Eleitor</h1>
        </div>
        <button
          id="logout-button"
          class="touch-target w-full rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-brand-300 hover:text-brand-700 md:w-auto"
        >
          Sair
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 sm:py-10">
      <div class="mb-6 sm:mb-8">
        <h2 class="text-2xl font-bold text-slate-900 sm:text-3xl">Escolha seu candidato</h2>
        <p class="mt-2 text-sm leading-relaxed text-slate-600 sm:text-base">
          Clique em um card para visualizar os detalhes e confirmar seu voto.
        </p>
      </div>

      <div id="candidate-grid" class="grid gap-4 sm:grid-cols-2 sm:gap-6 xl:grid-cols-3"></div>
      <p id="empty-state" class="hidden rounded-2xl border border-slate-200 bg-white p-6 text-slate-600">
        Nenhum candidato cadastrado no momento.
      </p>
    </main>

    <div id="candidate-modal" class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-4">
      <div class="modal-panel glass-panel max-h-[92vh] w-full max-w-md overflow-y-auto rounded-3xl border border-white/70 p-5 shadow-2xl sm:p-7">
        <button
          id="close-modal"
          class="touch-target ml-auto flex w-11 items-center justify-center rounded-xl text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
          aria-label="Fechar modal"
        >
          X
        </button>

        <div class="mt-2 text-center">
          <img
            id="modal-photo"
            src=""
            alt="Foto do candidato"
            class="mx-auto h-28 w-28 rounded-full border-4 border-brand-100 object-cover shadow-lg shadow-brand-100/70 sm:h-36 sm:w-36"
          />
          <h3 id="modal-name" class="mt-4 text-xl font-bold text-slate-900 sm:text-2xl"></h3>
          <p id="modal-description" class="mt-3 text-sm leading-relaxed text-slate-600 sm:text-base"></p>
        </div>

        <button
          id="confirm-vote"
          class="touch-target mt-8 w-full rounded-2xl bg-brand-600 px-4 py-3 text-base font-semibold text-white transition hover:bg-brand-700"
        >
          Confirmar Voto
        </button>
      </div>
    </div>

    <script src="/shared.js"></script>
    <script src="/voter.js"></script>
  </body>
</html>
