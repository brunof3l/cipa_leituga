<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Votacao CIPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#eff6ff",
                100: "#dbeafe",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
                900: "#1e3a8a",
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="safe-bottom text-slate-800">
    <main class="mx-auto flex min-h-screen max-w-7xl items-center px-4 py-6 sm:px-6 sm:py-12">
      <section class="grid w-full gap-5 lg:grid-cols-[1.15fr_0.85fr] lg:gap-8">
        <div class="flex flex-col justify-center text-center lg:text-left">
          <span class="mb-4 inline-flex w-fit self-center rounded-full bg-brand-100 px-4 py-1 text-xs font-semibold text-brand-700 sm:text-sm lg:self-start">
            Eleicao Interna CIPA 2026
          </span>
          <h1 class="max-w-2xl text-2xl font-bold tracking-tight text-slate-900 sm:text-4xl md:text-5xl">
            Site para votação anonima da CIPA.
          </h1>
          <p class="mx-auto mt-3 max-w-xl text-sm leading-relaxed text-slate-600 sm:mx-0 sm:mt-5 sm:text-lg">
            Acesse e vote.
          </p>
        </div>

        <div class="glass-panel rounded-3xl border border-white/70 p-4 shadow-2xl shadow-slate-300/30 sm:p-8">
          <div class="mb-6 sm:mb-8">
            <h2 class="text-xl font-semibold text-slate-900 sm:text-2xl">Entrar no sistema</h2>
            <p class="mt-2 text-sm text-slate-600">
              Informe sua senha de acesso para ser redirecionado para a area de votação.
            </p>
          </div>

          <form id="login-form" class="space-y-5">
            <div>
              <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Senha</label>
              <input
                id="password"
                name="password"
                type="password"
                required
                class="touch-target w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-base text-slate-900 outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-100"
                placeholder="Digite sua senha"
              />
            </div>

            <button
              type="submit"
              class="touch-target w-full rounded-2xl bg-brand-600 px-4 py-3 text-base font-semibold text-white transition hover:bg-brand-700"
            >
              Acessar
            </button>
          </form>

          <p id="feedback" class="mt-4 hidden rounded-2xl border px-4 py-3 text-sm"></p>

        </div>
      </section>
    </main>

    <script src="/shared.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
